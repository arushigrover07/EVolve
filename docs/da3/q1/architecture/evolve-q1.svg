<text x="60" y="686" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#385779" font-weight="400">Network: evolve_default | API ports are internal only | 3 x 5 connections = 15 maximum</text>
<text x="60" y="712" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#385779" font-weight="400">Telemetry disabled in API processes; PG_CONNECT_TIMEOUT_MS set to 15000ms for WAN stability.</text>
