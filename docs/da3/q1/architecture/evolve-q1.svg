<text x="1016" y="385" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#172033" font-weight="400">TLS verification stays enabled</text>
<text x="1016" y="409" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#172033" font-weight="400">1,949 stations (~536 KB JSON)</text>
<text x="1016" y="433" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#172033" font-weight="400">Average ~267 ms WAN RTT</text>
<text x="1016" y="457" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#172033" font-weight="400">No writes or migrations performed</text>
<text x="1005" y="547" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#047857" font-weight="400">Read-only SQL queries verified during benchmarks.</text>
