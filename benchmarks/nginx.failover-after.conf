# Compose-only configuration. The deployed image retains nginx.conf by default.
upstream evolve_api {
    zone evolve_api 64k;
    server backend1:5000 max_fails=1 fail_timeout=30s;
    server backend2:5000 max_fails=1 fail_timeout=30s;
    server backend3:5000 max_fails=1 fail_timeout=30s;
}

# Omit request URLs, query strings, bodies and authorization headers from access logs.
log_format evolve_proxy '$time_iso8601 method=$request_method status=$status '
                        'upstream=$upstream_addr instance=$upstream_http_x_instance_id';

server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access.log evolve_proxy;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 1s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_cache off;
    # Benchmark only: do not hide a failed upstream attempt with a retry.
    proxy_next_upstream off;

    # Retry only the benchmark's idempotent read endpoint. Do not enable non_idempotent.
    location = /api/stations {
        limit_except GET { deny all; }
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;
        proxy_pass http://evolve_api;
    }
    location /api/ {
        proxy_pass http://evolve_api;
    }

    location = /health {
        proxy_pass http://evolve_api;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
