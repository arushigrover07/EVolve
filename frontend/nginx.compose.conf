# Compose-only configuration. The deployed image retains nginx.conf by default.
upstream evolve_api {
    server backend1:5000;
    server backend2:5000;
    server backend3:5000;
}

# Omit request URLs, query strings, bodies and authorization headers from access logs.
log_format evolve_proxy '$time_iso8601 method=$request_method status=$status '
                        'upstream=$upstream_addr instance=$upstream_http_x_instance_id';

server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access.log evolve_proxy;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_cache off;

    location /api/ {
        # No URI suffix: preserve the full path, query, method and body.
        proxy_pass http://evolve_api;
    }

    location = /health {
        proxy_pass http://evolve_api;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
