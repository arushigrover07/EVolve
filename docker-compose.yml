x-api: &api
  build: ./backend
  command: ["node", "server.js"]
  expose:
    - "5000"
  env_file:
    - ./backend/.env
  environment:
    PORT: "5000"
    PG_POOL_MAX: "5"
    TELEMETRY_ENABLED: "false"
  healthcheck:
    # Process liveness only; this does not query the database.
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health', { signal: AbortSignal.timeout(2000) }).then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
    interval: 15s
    timeout: 3s
    retries: 3
    start_period: 10s
  stop_grace_period: 20s

services:
  backend1: *api
  backend2: *api
  backend3: *api

  # Opt-in only: docker compose --profile telemetry up telemetry
  telemetry:
    profiles: ["telemetry"]
    build: ./backend
    command: ["node", "workers/telemetryWorker.js"]
    env_file:
      - ./backend/.env
    environment:
      TELEMETRY_ENABLED: "true"
      PG_POOL_MAX: "5"
    stop_grace_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "/"
    ports:
      - "5173:80"
    volumes:
      - ./frontend/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
